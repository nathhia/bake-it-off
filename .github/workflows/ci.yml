name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configura o JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configura o Gradle (com cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Dá permissão de execução ao gradlew
        run: chmod +x gradlew

      # Não usa nenhum segredo real: local.properties não existe em CI, e
      # app/build.gradle.kts trata chaves ausentes como string vazia — o
      # build compila normalmente sem elas.
      - name: Roda os testes unitários
        run: ./gradlew testDebugUnitTest

      - name: Compila o APK debug
        run: ./gradlew assembleDebug
